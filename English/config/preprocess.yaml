dataset: Svarah
path:
  corpus_path: /home/ming/Data/LJSpeech-1.1
  lexicon_path: /content/drive/MyDrive/FastSpeech2_Assignment/project/English/lexicon/english_alignment_provisional.dict
  raw_path: /content/fastspeech2_alignment/english_full/corpus
  preprocessed_path: /content/fastspeech2_features/english_processed
preprocessing:
  val_size: 626
  text:
    text_cleaners:
    - english_cleaners
    language: en
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
