dataset: IndicTTS_Telugu
path:
  corpus_path: /home/ming/Data/LJSpeech-1.1
  lexicon_path: /content/drive/MyDrive/FastSpeech2_Assignment/project/Telugu/lexicon/telugu_alignment_candidates.dict
  raw_path: /content/fastspeech2_alignment/telugu_full/corpus
  preprocessed_path: /content/fastspeech2_features/telugu_raw
preprocessing:
  val_size: 357
  text:
    text_cleaners:
    - english_cleaners
    language: te
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true
workflow:
  reference_repo: /content/FastSpeech2_telugu
  manifest_directory: /content/drive/MyDrive/FastSpeech2_Assignment/project/Telugu/manifests
  train_manifest: train_alignment_available.jsonl
  validation_manifest: validation_alignment_available.jsonl
  normalization_status: not_fitted
  acoustic_source: recorded_16khz_alignment_exports
  alignment_export_gain_record: /content/drive/MyDrive/FastSpeech2_Assignment/project/reproducibility/telugu_alignment_inputs.json
